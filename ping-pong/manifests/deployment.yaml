apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: daduam/dwk-ping-pong
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres-stset-0.postgres-svc.exercises:5432/postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
