apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: the-project-todos-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: the-project-todos-svc
            port:
              number: 1234
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: the-project-todos-backend-svc
            port:
              number: 1234
